# Weekly dependency update PRs. Minor and patch npm updates arrive as one
# grouped PR so they do not drown out real work; majors come one at a time,
# since this repo pins to Next.js 16 behaviour (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned on purpose to 2.109.0 to stop the Find auth refresh storm
      # (commit f565aba); src/lib/supabase/auth-regression.test.ts guards it.
      # Upgrade by hand, re-testing sign-in on a find.* host, never in a batch.
      - dependency-name: "@supabase/supabase-js"
      # 0.10+ requires supabase-js >= 2.114, so it moves with the pin above.
      - dependency-name: "@supabase/ssr"
      # typescript-eslint (via eslint-config-next) needs typescript < 6.1;
      # TypeScript 7 stops lint from loading at all. Lift when it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Type definitions follow the Node major production runs (24.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
