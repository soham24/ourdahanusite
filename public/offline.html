<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — OurDahanu</title>
  <style>
    body { font-family: sans-serif; background: #f9fafb; color: #111827; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 16px; padding: 40px 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
    p { color: #6b7280; font-size: 15px; margin: 0 0 28px; line-height: 1.6; }
    .numbers { text-align: left; border: 1px solid #f3f4f6; border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
    .num { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f9fafb; font-size: 15px; text-decoration: none; color: inherit; }
    .num:last-child { border-bottom: none; }
    .num:hover { background: #f9fafb; }
    .num .label { font-weight: 600; color: #374151; }
    .num .dial { font-weight: 800; color: #dc2626; font-size: 18px; }
    .btn { display: inline-block; background: #16a34a; color: #fff; font-weight: 700; padding: 12px 28px; border-radius: 12px; text-decoration: none; font-size: 15px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>You're Offline</h1>
    <p>No internet connection — but emergency contacts are always available.</p>
    <div class="numbers">
      <a class="num" href="tel:100"><span class="label">Police</span><span class="dial">100</span></a>
      <a class="num" href="tel:108"><span class="label">Ambulance</span><span class="dial">108</span></a>
      <a class="num" href="tel:101"><span class="label">Fire Brigade</span><span class="dial">101</span></a>
    </div>
    <a class="btn" href="/emergency">View Emergency Contacts</a>
  </div>
</body>
</html>
