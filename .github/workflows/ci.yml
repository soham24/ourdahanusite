name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        # Warnings are an existing backlog; only errors fail the build.
        run: npx eslint

      - name: Tests
        run: npm test

      - name: Build
        # Also runs scripts/check-action-boundaries.mjs via postbuild, which
        # fails if a server action exposes a credential to client code.
        run: npm run build
        env:
          # Placeholders, not real credentials. Prerendering does call
          # Supabase -- generateStaticParams and the 'use cache' fetchers
          # both do -- and against this URL those calls fail into their
          # empty-state fallbacks. So CI proves the app compiles, type
          # checks and renders its empty states; it does not exercise
          # rendering with real rows.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
