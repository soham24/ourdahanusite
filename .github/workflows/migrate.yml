name: Migrate database

# Applies new files in supabase/migrations/ to the production Supabase project
# when they reach main, so nobody has to paste SQL into the dashboard.
#
# Off until configured. In GitHub → Settings → Secrets and variables → Actions:
#   Variable  SUPABASE_PROJECT_REF   the project's reference id
#   Secret    SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens
#   Secret    SUPABASE_DB_PASSWORD   the database password
# Then, once, make the project's migration history match this repository
# (docs/DATABASE-MIGRATIONS.md); until then `db push` refuses or, worse, tries
# to re-run the baseline.
#
# Runs in the `production` environment: add yourself as a required reviewer in
# Settings → Environments → production and every run waits for your approval.

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
  workflow_dispatch:

concurrency:
  group: migrate-production
  cancel-in-progress: false

jobs:
  push:
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Link the project
        run: npx --yes supabase@2.120.0 link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      - name: What would be applied
        run: npx --yes supabase@2.120.0 db push --dry-run

      - name: Apply
        run: npx --yes supabase@2.120.0 db push
