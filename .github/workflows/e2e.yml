name: E2E

# Browser smoke test (e2e/smoke.mjs) against a production build backed by
# the local Supabase stack, set up exactly the way a contributor does it:
# `npm run setup`. Covers page crashes, hydration errors, business-subdomain
# routing and the sign-in round trip. Then Lighthouse on the same server
# (lighthouserc.json): accessibility, best practices and SEO fail below 90;
# performance only warns, since shared runners make it noisy. Reports are
# kept as the `lighthouse` artifact of each run.

# Least privilege: these workflows only read the repository. A public
# repo hands this token to every fork's pull request build, so it is
# spelled out rather than left to the repository default.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Browser
        run: npx playwright install --with-deps chromium

      - name: Local database (migrations + sample data)
        run: npm run setup

      - name: Build
        run: npm run build

      - name: Smoke test
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          npm run test:e2e

      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: .lighthouseci/reports
          if-no-files-found: ignore

      - name: Server log
        if: failure()
        run: tail -100 server.log || true
